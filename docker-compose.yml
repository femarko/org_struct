services:

  db:
    image: postgres:16-alpine
    ports:
      - "5430:5432"
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg_admin:
    image: dpage/pgadmin4:8
    env_file:
      - .env
    ports:
      - "5050:80"
    mem_limit: 2g
    cpus: 0.5
    depends_on:
      - db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: org_struct_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head && uvicorn org_struct.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
